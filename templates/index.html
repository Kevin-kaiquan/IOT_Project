<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mushroom Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root{--bg:#0b1020;--ink:#e7ecff;--muted:#9fb0d8;--card:#121a33;--accent:#7aa2ff}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:1180px;margin:22px auto;padding:0 16px}
  h1{margin:0 0 6px;font-size:28px;font-weight:800}
  .sub{color:var(--muted);margin-bottom:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
  .camera-card{position:relative;overflow:hidden}
  .camera-frame{position:relative;border-radius:12px;overflow:hidden;height:260px;background:radial-gradient(circle at 30% 40%,rgba(122,162,255,.12),transparent 35%),
    radial-gradient(circle at 70% 60%,rgba(122,162,255,.08),transparent 40%),#080c19;border:1px solid rgba(255,255,255,.06)}
  .camera-feed{width:100%;height:100%;background:repeating-linear-gradient(135deg,rgba(255,255,255,.03),rgba(255,255,255,.03) 6px,transparent 6px,transparent 12px)}
  .bbox{position:absolute;inset:20% 18%;border:2px solid var(--accent);border-radius:10px;box-shadow:0 0 12px rgba(122,162,255,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none}
  .bbox-label{padding:4px 10px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .bbox-diff{font-size:13px;color:var(--ink);text-align:center;max-width:90%;line-height:1.4;background:rgba(8,12,25,.7);padding:6px 10px;border-radius:10px;border:1px solid rgba(122,162,255,.4)}
  .row{display:flex;align-items:center;gap:8px}
  .value{font-size:34px;font-weight:800;margin:4px 0}
  button{border:0;border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;background:#1d2a52;color:#cfe0ff}
  .ok{background:var(--accent);color:#fff}
  .chip{font-size:12px;padding:4px 8px;border-radius:12px;background:#1b2240;color:#b6c5f3}
  canvas{width:100%!important;height:280px!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mushroom Environment Dashboard</h1>
  <div class="sub">Updates every <span id="interval"></span> seconds</div>

  <div class="card camera-card">
    <div class="row" style="margin-bottom:8px">
      <div style="font-weight:700">Target Mushroom View</div>
      <div class="chip" id="idealSummary">Ideal: --</div>
    </div>
    <div class="camera-frame">
      <div class="camera-feed" aria-label="Target mushroom camera preview"></div>
      <div class="bbox" id="bbox">
        <div class="bbox-label">Target</div>
        <div class="bbox-diff" id="bboxDiff">Waiting for data…</div>
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="row">
        <div style="font-weight:700">Current CO₂</div>
        <div id="co2src" class="chip">source: --</div>
        <div class="chip" id="atom">Atomizer: --</div>
      </div>
      <div class="value" id="co2">-- ppm</div>
      <div class="row" style="margin-top:8px">
        <button id="on" class="ok">Atomizer ON</button>
        <button id="off">OFF</button>
      </div>
      <div style="margin-top:12px">
        <canvas id="co2Chart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="row"><div style="font-weight:700">Probe Temperatures (1-Wire)</div></div>
      <div class="row" style="gap:12px;margin:6px 0 6px">
        <div class="chip" id="t1c">T1: -- °C</div>
        <div class="chip" id="t2c">T2: -- °C</div>
      </div>
      <canvas id="tempChart"></canvas>
    </div>

    <div class="card">
      <div class="row"><div style="font-weight:700">Humidity (SHT4x)</div></div>
      <div class="value" id="rh">-- %RH</div>
      <canvas id="rhChart"></canvas>
    </div>

    <div class="card">
      <div class="row"><div style="font-weight:700">Light (VELM7700)</div></div>
      <div class="value" id="light">-- %</div>
      <canvas id="lightChart"></canvas>
    </div>
  </div>
</div>

<script>
const SAMPLE_INTERVAL = {{ sample_interval|tojson }};
const IDEAL = {{ ideal_environment|tojson }};
document.getElementById('interval').textContent = SAMPLE_INTERVAL;

// --- charts ---
const tsLabels = [];
const maxPoints = 60; // 约3分钟
const co2Data = []; const t1Data=[]; const t2Data=[]; const rhData=[]; const lightData=[];
const bboxDiffEl = document.getElementById('bboxDiff');
const idealSummaryEl = document.getElementById('idealSummary');

function formatNumber(v, digits=1){
  return v==null? '--' : Number(v).toFixed(digits);
}

function formatDelta(value, ideal, unit, digits=1){
  if(value==null || ideal==null) return `n/a ${unit}`;
  const delta = value - ideal;
  const sign = delta>0? '+' : '';
  return `${sign}${delta.toFixed(digits)}${unit}`;
}

function updateIdealSummary(){
  const parts = [
    `Temp ${formatNumber(IDEAL.temp_c, 1)}°C`,
    `Humidity ${formatNumber(IDEAL.humidity, 1)}%RH`,
    `CO₂ ${formatNumber(IDEAL.co2_ppm, 0)}ppm`,
    `Light ≥${formatNumber(IDEAL.light_lux, 0)} lux`,
  ];
  idealSummaryEl.textContent = 'Ideal: ' + parts.join(' · ');
}

function makeLine(ctx, label, color) {
  return new Chart(ctx, {
    type:'line',
    data:{ labels: tsLabels, datasets:[{ label, data:[], fill:false, tension:0.25 }] },
    options:{ plugins:{legend:{labels:{color:'#cfe0ff'}}},
      scales:{
        x:{ ticks:{color:'#9fb0d8'} , grid:{color:'rgba(255,255,255,.06)'} },
        y:{ ticks:{color:'#9fb0d8'} , grid:{color:'rgba(255,255,255,.06)'} }
      }
    }
  });
}

const co2Chart = makeLine(document.getElementById('co2Chart'), 'CO₂ (ppm)');
const tempChart = new Chart(document.getElementById('tempChart'), {
  type:'line',
  data:{ labels: tsLabels, datasets:[
    {label:'T1 (°C)', data:t1Data, fill:false, tension:0.25},
    {label:'T2 (°C)', data:t2Data, fill:false, tension:0.25}
  ]},
  options:{ plugins:{legend:{labels:{color:'#cfe0ff'}}},
    scales:{ x:{ticks:{color:'#9fb0d8'},grid:{color:'rgba(255,255,255,.06)'}},
             y:{ticks:{color:'#9fb0d8'},grid:{color:'rgba(255,255,255,.06)'}} }
  }
});
const rhChart = makeLine(document.getElementById('rhChart'), 'RH (%)');
const lightChart = makeLine(document.getElementById('lightChart'), 'Light (%)');

updateIdealSummary();

function average(values){
  const valid = values.filter(v=>typeof v==='number' && !Number.isNaN(v));
  if(!valid.length) return null;
  return valid.reduce((a,b)=>a+b,0)/valid.length;
}

function updateBoundingBox(now){
  const tempAvg = average([now.temp1_c, now.temp2_c]);
  const humidity = typeof now.rh_air === 'number'? now.rh_air : null;
  const co2 = typeof now.co2_ppm === 'number'? now.co2_ppm : null;
  const light = typeof now.light === 'number'? now.light : null;

  const deltas = [
    `Temp Δ ${formatDelta(tempAvg, IDEAL.temp_c, '°C', 1)}`,
    `Humidity Δ ${formatDelta(humidity, IDEAL.humidity, '%RH', 1)}`,
    `CO₂ Δ ${formatDelta(co2, IDEAL.co2_ppm, 'ppm', 0)}`,
    `Light Δ ${formatDelta(light, IDEAL.light_lux, 'lux', 0)}`,
  ];

  bboxDiffEl.textContent = deltas.join(' · ');
}

// --- atomizer buttons ---
document.getElementById('on').addEventListener('click', ()=>sendAtom('on'));
document.getElementById('off').addEventListener('click',()=>sendAtom('off'));
async function sendAtom(state){
  try{
    const r = await fetch('/api/atomizer', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({state})});
    const j = await r.json();
    if(j.ok) document.getElementById('atom').textContent = 'Atomizer: ' + j.state;
  }catch(_){}
}

// --- fetch & update ---
function pushPoint(arr, v){ arr.push(v); if(arr.length>maxPoints) arr.shift(); }
function pushLabel(){
  const t = new Date().toLocaleTimeString().slice(0,8);
  tsLabels.push(t); if(tsLabels.length>maxPoints) tsLabels.shift();
}

async function tick(){
  try{
    const r = await fetch('/api/data');
    const j = await r.json();
    const n = j.now || {};

    // 数字
    document.getElementById('co2').textContent = (n.co2_ppm!=null? Math.round(n.co2_ppm):'--') + ' ppm';
    document.getElementById('co2src').textContent = 'source: ' + (j.co2_source || 'scd41');
    document.getElementById('t1c').textContent = 'T1: ' + (n.temp1_c!=null? n.temp1_c.toFixed(2):'--') + ' °C';
    document.getElementById('t2c').textContent = 'T2: ' + (n.temp2_c!=null? n.temp2_c.toFixed(2):'--') + ' °C';
    document.getElementById('rh').textContent  = (n.rh_air!=null? n.rh_air.toFixed(1):'--') + ' %RH';
    document.getElementById('light').textContent = (n.light!=null? n.light.toFixed(1):'--') + ' lux';
    document.getElementById('atom').textContent = 'Atomizer: ' + (j.atomizer || '--');

    // 折线
    pushLabel();
    pushPoint(co2Data, n.co2_ppm ?? null);
    pushPoint(t1Data, n.temp1_c ?? null);
    pushPoint(t2Data, n.temp2_c ?? null);
    pushPoint(rhData, n.rh_air ?? null);
    pushPoint(lightData, n.light ?? null);

    co2Chart.data.datasets[0].data = co2Data;
    co2Chart.update('none');

    tempChart.data.datasets[0].data = t1Data;
    tempChart.data.datasets[1].data = t2Data;
    tempChart.update('none');

    rhChart.data.datasets[0].data = rhData;
    rhChart.update('none');

    lightChart.data.datasets[0].data = lightData;
    lightChart.update('none');

    updateBoundingBox(n);
  }catch(e){
    // ignore
  }
}

tick();
setInterval(tick, SAMPLE_INTERVAL*1000);
</script>
</body>
</html>
