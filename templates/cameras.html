<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dual Camera View</title>
<style>
  :root{--bg:#0b1020;--ink:#e7ecff;--card:#0f1730;--accent:#7aa2ff;--accent-2:#6be4c2;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:1420px;margin:20px auto;padding:0 16px}
  h1{margin:0 0 10px;font-size:26px;font-weight:800}
  .sub{color:#9fb0d8;margin-bottom:16px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card{background:linear-gradient(145deg,rgba(18,26,51,.96),rgba(12,19,38,.9));border-radius:16px;padding:16px;box-shadow:0 14px 32px rgba(0,0,0,.35);}
  .camera-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:14px;margin-top:12px}
  .camera-frame{position:relative;border-radius:16px;overflow:hidden;background:#050814;border:1px solid rgba(255,255,255,.08);box-shadow:0 16px 34px rgba(0,0,0,.36);}
  .camera-feed{width:100%;height:400px;object-fit:cover;display:block;filter:contrast(1.18) saturate(1.12) brightness(1.02);image-rendering:high-quality;background:#03060f;transition:opacity .2s ease,filter .2s ease}
  .detect-strip{position:absolute;left:12px;right:12px;bottom:12px;padding:12px 14px;border-radius:12px;background:rgba(12,19,38,.92);border:1px solid rgba(255,255,255,.12);color:#cfe0ff;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 12px 28px rgba(0,0,0,.3)}
  .detect-strip.active{background:linear-gradient(135deg,rgba(122,162,255,1),rgba(107,228,194,1));color:#0b1020;border-color:rgba(255,255,255,.32);box-shadow:0 12px 28px rgba(107,228,194,.38),0 0 0 1px rgba(255,255,255,.14)}
  .detect-strip .meta{font-size:12px;font-weight:700;opacity:.9}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.06);color:#e7ecff;font-size:13px;border:1px solid rgba(255,255,255,.08)}
  .btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--accent);color:#0b1020;box-shadow:0 12px 26px rgba(122,162,255,.3)}
  .camera-frame[data-error]{border-color:rgba(255,122,138,.6);box-shadow:0 16px 34px rgba(255,122,138,.25),0 0 0 1px rgba(255,255,255,.08)}
  .camera-frame[data-error] .camera-feed{opacity:.55;filter:grayscale(.2) contrast(1.05)}
  .camera-frame[data-error]::after{content:attr(data-error);position:absolute;left:14px;right:14px;top:14px;padding:10px 12px;border-radius:10px;background:rgba(255,122,138,.12);border:1px solid rgba(255,122,138,.6);color:#ffc7d0;font-weight:800;backdrop-filter:blur(4px);box-shadow:0 10px 22px rgba(0,0,0,.35);}
</style>
</head>
<body>
<div class="wrap">
  <div class="row" style="justify-content:space-between;align-items:flex-start">
    <div>
      <h1>Dual camera detection</h1>
      <div class="sub">View both feeds live with bold detection banners on each frame</div>
    </div>
    <button class="btn" onclick="window.location.href='/'">Back to dashboard</button>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="pill" id="cameraStatus">Cameras: --</div>
      <div class="pill" id="ledStatus">LED: --</div>
    </div>
    <div class="camera-grid">
      <div class="camera-frame" data-cam="0">
        <img id="cameraFeed0" data-cam-id="0" class="camera-feed" alt="Camera 0 preview" />
        <div class="detect-strip" id="detectStrip0">
          <span data-role="label">No target detected</span>
          <span class="meta" data-role="meta">Waiting…</span>
        </div>
      </div>
      <div class="camera-frame" data-cam="1">
        <img id="cameraFeed1" data-cam-id="1" class="camera-feed" alt="Camera 1 preview" />
        <div class="detect-strip" id="detectStrip1">
          <span data-role="label">No target detected</span>
          <span class="meta" data-role="meta">Waiting…</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const IDEAL = {{ ideal_environment|tojson }};
const cameraFeeds = Array.from(document.querySelectorAll('.camera-feed'));
const detectStrips = Array.from(document.querySelectorAll('.detect-strip'));
const cameraOrder = [0,1];
const cameraUrls = {};
let latestLedState = '--';

function formatDelta(value, ideal, unit, digits=1){
  if(value==null || ideal==null) return `n/a ${unit}`;
  const delta = value - ideal;
  const sign = delta>0? '+' : '';
  return `${sign}${delta.toFixed(digits)}${unit}`;
}

function average(values){
  const valid = values.filter(v=>typeof v==='number' && !Number.isNaN(v));
  if(!valid.length) return null;
  return valid.reduce((a,b)=>a+b,0)/valid.length;
}

function updateDetection(now, detected, count, confidence){
  const tempAvg = average([now.temp1_c, now.temp2_c]);
  const humidity = typeof now.rh_air === 'number'? now.rh_air : null;
  const co2 = typeof now.co2_ppm === 'number'? now.co2_ppm : null;
  const light = typeof now.light === 'number'? now.light : null;
  const deltas = [
    `ΔT ${formatDelta(tempAvg, IDEAL.temp_c, '°C', 1)}`,
    `ΔRH ${formatDelta(humidity, IDEAL.humidity, '%RH', 1)}`,
    `ΔCO₂ ${formatDelta(co2, IDEAL.co2_ppm, 'ppm', 0)}`,
    `ΔLight ${formatDelta(light, IDEAL.light_lux, 'lux', 0)}`,
  ];

  const labelText = detected && count>0 ? `Detected ${count} mushrooms` : detected ? 'Target detected' : 'No target detected';
  const metaText = detected
    ? `p=${(confidence ?? 0).toFixed(2)} · ${deltas.join(' · ')}`
    : 'Waiting for LED cycle…';

  detectStrips.forEach(el=>{
    const labelEl = el.querySelector('[data-role="label"]');
    const metaEl = el.querySelector('[data-role="meta"]');
    if(labelEl) labelEl.textContent = labelText;
    if(metaEl) metaEl.textContent = metaText;
    el.classList.toggle('active', detected);
  });
}

async function refreshCameraFrame(){
  if(!cameraFeeds.length) return;
  const statuses = [];
  let statusMap = new Map();

  try{
    const sr = await fetch('/api/camera/status');
    if(sr.ok){
      const sj = await sr.json();
      statusMap = new Map((sj.cameras || []).map(c=>[Number(c.id), c]));
    }
  }catch(_){ /* ignore */ }

  for(const camId of cameraOrder){
    const feedEl = cameraFeeds.find(el=>Number(el.dataset.camId)===camId);
    const frameEl = feedEl ? feedEl.closest('.camera-frame') : null;
    if(!feedEl || !frameEl) continue;
    let ok = false;
    let errorMsg = '';
    try{
      const resp = await fetch(`/api/camera/${camId}/frame?ts=${Date.now()}`);
      if(resp.ok && resp.headers.get('Content-Type')?.includes('image/jpeg')){
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        if(cameraUrls[camId]) URL.revokeObjectURL(cameraUrls[camId]);
        cameraUrls[camId] = url;
        feedEl.src = url;
        ok = true;
      }else{
        try{
          const err = await resp.json();
          errorMsg = err.message || 'Camera unavailable';
        }catch(_){
          errorMsg = `Camera ${camId} unavailable`;
        }
      }
    }catch(_){
      ok = false;
      errorMsg = `Camera ${camId} offline`;
    }

    const statusInfo = statusMap.get(camId);
    if(statusInfo && !ok && statusInfo.error){
      errorMsg = statusInfo.error;
    }

    if(!ok){
      frameEl.dataset.error = errorMsg || 'No signal';
    }else{
      frameEl.removeAttribute('data-error');
    }

    const mapped = statusInfo && statusInfo.mapped_to != null ? `→${statusInfo.mapped_to}` : '';
    statuses.push(`${camId}:${ok ? '✓' : '—'}${mapped}`);
  }
  const cameraStatusEl = document.getElementById('cameraStatus');
  if(cameraStatusEl) cameraStatusEl.textContent = statuses.length ? `Cameras ${statuses.join(' · ')}` : 'Cameras: unavailable';
}

async function tick(){
  try{
    const r = await fetch('/api/data');
    const j = await r.json();
    const n = j.now || {};
    const cameraInfo = j.camera || {};
    const targetDetected = !!cameraInfo.target_detected;
    const mushroomCount = typeof cameraInfo.mushroom_count === 'number' ? cameraInfo.mushroom_count : 0;
    const detectionConfidence = typeof cameraInfo.detection_confidence === 'number' ? cameraInfo.detection_confidence : 0;
    latestLedState = (cameraInfo.led || '--').toString();
    const ledStatusEl = document.getElementById('ledStatus');
    if(ledStatusEl) ledStatusEl.textContent = `LED: ${latestLedState}`;

    updateDetection(n, targetDetected, mushroomCount, detectionConfidence);
  }catch(_){
    // ignore
  }
}

refreshCameraFrame();
tick();
setInterval(refreshCameraFrame, 2500);
setInterval(tick, 2000);
</script>
</body>
</html>
